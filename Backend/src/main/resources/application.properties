spring.application.name=cinebuddies-backend

# Server Port
server.port=8081

# Database Configuration (Pulls from .env with fallback)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require&stringtype=unspecified}
spring.datasource.username=${DB_USERNAME:postgres.ktwpmtsodvlcbjpuqypb}
spring.datasource.password=${DB_PASSWORD:CineBB@0018}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL Connection Properties for custom PostgreSQL Enums
spring.datasource.hikari.data-source-properties.stringtype=unspecified

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.repair-on-migrate=true

# Google OAuth2 & JWT Security Configuration
cinebuddies.auth.google.client-id=${GOOGLE_CLIENT_ID:610110362365-k86f6tacfpeuv220vk3e42hno621q22s.apps.googleusercontent.com}
